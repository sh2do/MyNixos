<linearGradient id="trail" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="{{colors.on_surface.default.hex}}" stop-opacity="0.08"/><stop offset="1" stop-color="{{colors.primary.default.hex}}" stop-opacity="0.32"/></linearGradient>
