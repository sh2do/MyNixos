# kitty outside Umbriel (Umbriel launches its own with --config
# ~/.config/umbriel-term/kitty.conf). Looks like foot: same font and padding,
# colours from the wallpaper via rice-wall (matugen writes colors.conf and
# signals running kittys to reload).
font_family      JetBrainsMono Nerd Font
font_size        11
window_padding_width 12 14
background_opacity 0.82
enable_audio_bell  no
update_check_interval 0
confirm_os_window_close 0

include colors.conf
