# cava for the Umbriel session: a gradient from slate up to bright.
# Run as `cava -p ~/.config/umbriel-term/cava.conf`; the niri config
# (~/.config/cava/config) is untouched.
[general]
framerate = 60

[input]
method = pulse
source = auto

[output]
method = ncurses
style = stereo

[color]
background = '#0a0b0e'
gradient = 1
gradient_count = 6
gradient_color_1 = '#4a4f58'
gradient_color_2 = '#5d636e'
gradient_color_3 = '#7d8796'
gradient_color_4 = '#a4adba'
gradient_color_5 = '#d6dbe3'
gradient_color_6 = '#eef1f5'

[smoothing]
noise_reduction = 85
monstercat = 1
waves = 0
gravity = 120
