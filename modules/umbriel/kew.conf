# kew theme for the Umbriel session: the slate ramp, `bright` as the only accent.
# Deployed as ~/.config/kew/themes/umbriel.theme; pick it in kew with `i` (or
# `kew theme umbriel`).
[theme]
name=Umbriel

# Core colors
accent=#eef1f5
text=#d6dbe3
textDim=#7d8796
textMuted=#4a4f58

# General Colors
logo=#4a4f58
header=#7d8796
footer=#4a4f58
help=#7d8796
link=#8b94a3
nowplaying=#eef1f5
playbackstatus=#7d8796

# Playlist View
playlist.rownum=#4a4f58
playlist.title=#d6dbe3
playlist.playing=#eef1f5

# Track View
trackview.title=#eef1f5
trackview.artist=#8b94a3
trackview.album=#7d8796
trackview.year=#4a4f58
trackview.time=#7d8796
trackview.visualizer=#8b94a3
trackview.lyrics=#7d8796

# Library View
library.artist=#8b94a3
library.album=#d6dbe3
library.track=#d6dbe3
library.enqueued=#7d8796
library.playing=#eef1f5

# Search
search.label=#7d8796
search.query=#eef1f5
search.result=#d6dbe3
search.enqueued=#7d8796
search.playing=#eef1f5

# Progress
progress.filled=#eef1f5
progress.empty=#262a31
progress.elapsed=#7d8796

# Status
status.info=#7d8796
status.warning=#8b94a3
status.error=#8b94a3
status.success=#d6dbe3
