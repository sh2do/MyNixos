# foot for the Umbriel session: the slate palette, no transparency. Used as
# `foot --config ~/.config/umbriel-term/foot.ini`; niri's foot is untouched.
[main]
font=JetBrainsMono Nerd Font:size=11
pad=14x12
term=xterm-256color

[cursor]
style=beam
blink=yes

[mouse]
hide-when-typing=yes

[colors-dark]
alpha=1.0
background=0a0b0e
foreground=d6dbe3
selection-background=262a31
selection-foreground=eef1f5
cursor=0a0b0e eef1f5
regular0=14161b
regular1=7d8796
regular2=8b94a3
regular3=a4adba
regular4=4a4f58
regular5=7d8796
regular6=8b94a3
regular7=d6dbe3
bright0=262a31
bright1=a4adba
bright2=b4bcc8
bright3=c6ccd6
bright4=7d8796
bright5=a4adba
bright6=b4bcc8
bright7=eef1f5
