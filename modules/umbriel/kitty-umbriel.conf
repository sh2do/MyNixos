# kitty for the Umbriel session: the slate palette (foot's old one), no
# transparency. Launched as `kitty --class umbriel-term --config
# ~/.config/umbriel-term/kitty.conf`; niri keeps foot and never reads this.
font_family      JetBrainsMono Nerd Font
font_size        11
# foot's pad=14x12: 12 top and bottom, 14 left and right.
window_padding_width 12 14

cursor_shape          beam
cursor_blink_interval 0.5
mouse_hide_wait       -1

background_opacity 1.0
enable_audio_bell  no
visual_bell_duration 0
window_alert_on_bell no
update_check_interval 0
allow_remote_control no
confirm_os_window_close 0

background           #0a0b0e
foreground           #d6dbe3
selection_background #262a31
selection_foreground #eef1f5
cursor               #eef1f5
cursor_text_color    #0a0b0e
color0  #14161b
color1  #7d8796
color2  #8b94a3
color3  #a4adba
color4  #4a4f58
color5  #7d8796
color6  #8b94a3
color7  #d6dbe3
color8  #262a31
color9  #a4adba
color10 #b4bcc8
color11 #c6ccd6
color12 #7d8796
color13 #a4adba
color14 #b4bcc8
color15 #eef1f5
