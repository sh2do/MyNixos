# matugen config used by rice-wall. Paths are relative to $HOME via ~.
# Custom colours are blended toward the wallpaper so terminal reds/greens fit in.

[config.custom_colors]
red = { color = "#e06c75", blend = true }
green = { color = "#98c379", blend = true }
yellow = { color = "#e5c07b", blend = true }
blue = { color = "#61afef", blend = true }
magenta = { color = "#c678dd", blend = true }
cyan = { color = "#56b6c2", blend = true }

[templates.colors-json]
input_path = "~/.config/matugen/templates/colors.json"
output_path = "~/.cache/rice/colors.json"

[templates.rofi]
input_path = "~/.config/matugen/templates/colors.rasi"
output_path = "~/.cache/rice/colors.rasi"

[templates.foot]
input_path = "~/.config/matugen/templates/foot-colors.ini"
output_path = "~/.config/foot/colors.ini"

[templates.starship]
input_path = "~/.config/matugen/templates/starship.toml"
output_path = "~/.config/starship.toml"

[templates.niri]
input_path = "~/.config/matugen/templates/niri-colors.kdl"
output_path = "~/.config/niri/colors.kdl"
post_hook = "niri msg action load-config-file || true"

[templates.koi]
input_path = "~/.config/matugen/templates/koi.svg"
output_path = "~/.cache/rice/koi.svg"
post_hook = "rsvg-convert -w 512 \"$HOME/.cache/rice/koi.svg\" -o \"$HOME/.cache/rice/koi.png\""

# Water drips on the rofi menu glass (modules/rofi/theme.rasi): the strip under
# the list and the selected row's pill with its drop.
[templates.drips]
input_path = "~/.config/matugen/templates/drips.svg"
output_path = "~/.cache/rice/drips.svg"
post_hook = "rsvg-convert \"$HOME/.cache/rice/drips.svg\" -o \"$HOME/.cache/rice/drips.png\""

[templates.drip-row]
input_path = "~/.config/matugen/templates/drip-row.svg"
output_path = "~/.cache/rice/drip-row.svg"
post_hook = "rsvg-convert \"$HOME/.cache/rice/drip-row.svg\" -o \"$HOME/.cache/rice/drip-row.png\""

# GTK 3 and 4 (libadwaita named colours); Home Manager leaves gtk.css to us.
[templates.gtk3]
input_path = "~/.config/matugen/templates/gtk.css"
output_path = "~/.config/gtk-3.0/gtk.css"

[templates.gtk4]
input_path = "~/.config/matugen/templates/gtk.css"
output_path = "~/.config/gtk-4.0/gtk.css"

# Qt 5 and 6 (qt5ct/qt6ct palettes; QT_QPA_PLATFORMTHEME=qt5ct, configuration.nix).
# KDE apps read KColorScheme from kdeglobals as well, so write the scheme there
# too. Running Qt apps keep their old palette until restarted.
[templates.qt5ct]
input_path = "~/.config/matugen/templates/qtct-colors.conf"
output_path = "~/.config/qt5ct/colors/rice.conf"

[templates.qt6ct]
input_path = "~/.config/matugen/templates/qtct-colors.conf"
output_path = "~/.config/qt6ct/colors/rice.conf"

[templates.kde-scheme]
input_path = "~/.config/matugen/templates/kde-colors.colors"
output_path = "~/.local/share/color-schemes/Rice.colors"

[templates.kdeglobals]
input_path = "~/.config/matugen/templates/kde-colors.colors"
output_path = "~/.config/kdeglobals"

# Firefox: the profile name is random, so these land in the cache and rice-wall
# copies them into every profile in profiles.ini. Read at Firefox start only.
[templates.firefox-chrome]
input_path = "~/.config/matugen/templates/firefox-userChrome.css"
output_path = "~/.cache/rice/firefox/userChrome.css"

[templates.firefox-content]
input_path = "~/.config/matugen/templates/firefox-userContent.css"
output_path = "~/.cache/rice/firefox/userContent.css"

# Discord (with Vencord): a local theme, reloaded live. rice-wall switches it on once.
[templates.vencord]
input_path = "~/.config/matugen/templates/vencord.css"
output_path = "~/.config/Vencord/themes/rice.css"

# kitty outside Umbriel; SIGUSR1 makes running kittys reload their config.
[templates.kitty]
input_path = "~/.config/matugen/templates/kitty-colors.conf"
output_path = "~/.config/kitty/colors.conf"
post_hook = "pkill -USR1 -x kitty || true"
