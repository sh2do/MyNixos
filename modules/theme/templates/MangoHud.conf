# Generated by rice-wall (matugen) from modules/theme/templates/MangoHud.conf.
# MangoHud rereads it while a game runs. Start a game with
# `gamemoderun mangohud %command%` (docs/RICE.md, Gaming).
# A small overlay in the top-left: FPS and frame time, CPU and GPU load and
# temperature, VRAM. Shift+F12 shows and hides it.
legacy_layout=false
toggle_hud=Shift_L+F12
position=top-left
offset_x=12
offset_y=12
font_size=16
round_corners=10
background_alpha=0.55
alpha=0.95
hud_compact

fps
frametime
frame_timing
cpu_stats
cpu_temp
gpu_stats
gpu_temp
vram

background_color={{colors.surface_container.default.hex_stripped}}
text_color={{colors.on_surface.default.hex_stripped}}
fps_color={{colors.primary.default.hex_stripped}}
frametime_color={{colors.primary.default.hex_stripped}}
cpu_color={{colors.secondary.default.hex_stripped}}
gpu_color={{colors.tertiary.default.hex_stripped}}
vram_color={{colors.tertiary.default.hex_stripped}}
engine_color={{colors.on_surface_variant.default.hex_stripped}}
