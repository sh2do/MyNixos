# Generated by rice-wall (matugen) from the current wallpaper. Edit the
# template in /etc/nixos/modules/theme/templates/starship.toml instead.
add_newline = true
format = """
$directory$git_branch$git_status$nix_shell$python$rust$nodejs$cmd_duration
$character"""

[directory]
style = "bold {{colors.primary.default.hex}}"
truncation_length = 3
truncate_to_repo = true
read_only = " 󰌾"

[git_branch]
format = "on [$symbol$branch]($style) "
symbol = " "
style = "{{colors.tertiary.default.hex}}"

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "{{colors.error.default.hex}}"

[nix_shell]
format = 'via [❄ $state( \($name\))]($style) '
style = "{{colors.secondary.default.hex}}"

[python]
format = "via [$symbol$version]($style) "
symbol = " "
style = "{{colors.secondary.default.hex}}"

[rust]
format = "via [$symbol$version]($style) "
symbol = "󱘗 "
style = "{{colors.secondary.default.hex}}"

[nodejs]
format = "via [$symbol$version]($style) "
symbol = " "
style = "{{colors.secondary.default.hex}}"

[cmd_duration]
format = "took [$duration]($style) "
style = "{{colors.outline.default.hex}}"

[character]
success_symbol = "[❯]({{colors.primary.default.hex}})"
error_symbol = "[❯]({{colors.error.default.hex}})"
vimcmd_symbol = "[❮]({{colors.tertiary.default.hex}})"
