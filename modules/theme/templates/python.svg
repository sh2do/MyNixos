<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 64 64" width="512" height="512">
  <!-- The bar's reticulated python coiled into a ball, head tucked in; rendered for fastfetch.
       Same colour roles as modules/shell/Python.qml. -->
  <defs>
    <!-- Back (upper) and front (lower) halves of three stacked coils, bottom to top. -->
    <path id="b1" d="M 10 50 A 22 8.5 0 0 1 54 50"/>
    <path id="b2" d="M 14 41 A 18 7.5 0 0 1 50 41"/>
    <path id="b3" d="M 19 33 A 13 6 0 0 1 45 33"/>
    <path id="f1" d="M 54 50 A 22 8.5 0 0 1 10 50"/>
    <path id="f2" d="M 50 41 A 18 7.5 0 0 1 14 41"/>
    <path id="f3" d="M 45 33 A 13 6 0 0 1 19 33"/>
    <path id="neck" d="M 20 31.5 C 20.5 27 24 24 29 24.5"/>
  </defs>

  <g fill="none" stroke-linecap="round">
    <!-- tail, under everything -->
    <path d="M 10 50 C 6.5 53 6 56 9.5 58" stroke="{{colors.surface.default.hex}}" stroke-width="5"/>
    <path d="M 10 50 C 6.5 53 6 56 9.5 58" stroke="{{colors.surface_container.default.hex}}" stroke-width="3.2"/>
  </g>

  <!-- backs, then fronts, each in five layers: outline, body, saddle outlines,
       saddles, flecks. Uneven dashes read as the net pattern. -->
  <g fill="none">
    <g stroke="{{colors.surface.default.hex}}" stroke-width="9.4" stroke-linecap="round">
      <use xlink:href="#b1"/><use xlink:href="#b2"/><use xlink:href="#b3"/>
    </g>
    <g stroke="{{colors.surface_container.default.hex}}" stroke-width="7.6" stroke-linecap="round">
      <use xlink:href="#b1"/><use xlink:href="#b2"/><use xlink:href="#b3"/>
    </g>
    <g stroke="{{colors.surface.default.hex}}" stroke-width="5.8" stroke-dasharray="5 2.6 3.4 3 6.2 2.2">
      <use xlink:href="#b1"/><use xlink:href="#b2"/><use xlink:href="#b3"/>
    </g>
    <g stroke="{{colors.primary_container.default.hex}}" stroke-width="3.6" stroke-dasharray="3.4 4.2 1.8 4.6 4.6 3.8" stroke-dashoffset="-0.8">
      <use xlink:href="#b1"/><use xlink:href="#b2"/><use xlink:href="#b3"/>
    </g>
    <g stroke="{{colors.tertiary.default.hex}}" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="0.1 8.1 0.1 7.4 0.1 6.6" stroke-dashoffset="-6.3">
      <use xlink:href="#b1"/><use xlink:href="#b2"/><use xlink:href="#b3"/>
    </g>
  </g>
  <g fill="none">
    <g stroke="{{colors.surface.default.hex}}" stroke-width="9.4" stroke-linecap="round">
      <use xlink:href="#f1"/><use xlink:href="#f2"/><use xlink:href="#f3"/><use xlink:href="#neck"/>
    </g>
    <g stroke="{{colors.surface_container.default.hex}}" stroke-width="7.6" stroke-linecap="round">
      <use xlink:href="#f1"/><use xlink:href="#f2"/><use xlink:href="#f3"/><use xlink:href="#neck"/>
    </g>
    <g stroke="{{colors.surface.default.hex}}" stroke-width="5.8" stroke-dasharray="5 2.6 3.4 3 6.2 2.2">
      <use xlink:href="#f1"/><use xlink:href="#f2"/><use xlink:href="#f3"/><use xlink:href="#neck"/>
    </g>
    <g stroke="{{colors.primary_container.default.hex}}" stroke-width="3.6" stroke-dasharray="3.4 4.2 1.8 4.6 4.6 3.8" stroke-dashoffset="-0.8">
      <use xlink:href="#f1"/><use xlink:href="#f2"/><use xlink:href="#f3"/><use xlink:href="#neck"/>
    </g>
    <g stroke="{{colors.tertiary.default.hex}}" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="0.1 8.1 0.1 7.4 0.1 6.6" stroke-dashoffset="-6.3">
      <use xlink:href="#f1"/><use xlink:href="#f2"/><use xlink:href="#f3"/><use xlink:href="#neck"/>
    </g>
  </g>

  <!-- head resting on the top coil: a long wedge, dark crown line, small eyes -->
  <g transform="translate(29 24.5) rotate(14) scale(0.68)">
    <path d="M -4 -5.5 C 2 -7.5 8 -7.5 12 -5 Q 17 -3 17 0 Q 17 3 12 5 C 8 7.5 2 7.5 -4 5.5 Z"
          fill="{{colors.secondary.default.hex}}" stroke="{{colors.surface.default.hex}}" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="M -2 0 L 14 0" stroke="{{colors.surface.default.hex}}" stroke-width="1.1" stroke-linecap="round"/>
    <circle cx="10.4" cy="-4.4" r="1.25" fill="{{colors.tertiary.default.hex}}"/>
    <circle cx="10.4" cy="4.4" r="1.25" fill="{{colors.tertiary.default.hex}}"/>
  </g>
</svg>
